<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <!-- CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="flex-col">
    <div class="text-5xl bg-gray-900 text-white text-center pt-1 h-16 mb-2">
        <h1><u><b>✨Premium Shoes✨</b></u></h1>
    </div>
    <div class="bg-orange-100 flex justify-center gap-4 items-center flex-col md:flex-row">
        <!-- card-1 -->
        <div class="bg-orange-300 hover:shadow-2xl max-w-sm w-full h-full mt-4 mb-4 rounded-xl">
            <div class="m-4">
                <img src="./images/shoes-1.png" alt="Running shoes">
            </div>
            <h2 class="text-3xl text-amber-900  pl-2 "><i>Starlet shoes</i></h2>
            <p class="text-gray-800  text-2xl pl-2">Leather shoes for mens</p>

            <h1 class="text-center text-4xl text-black pt-3"><sup>PKR</sup><b>49999/-</b> <del>69999/-</del></h1>
            <button
                class="flex items-center justify-center bg-green-900 hover:bg-green-700 pt-1 pb-1 text-white font-bold shadow-xl rounded-xl m-6 w-80 ml-[30px] h-[40px]">
                Add to Cart</button>

        </div>
        <!-- card-2 -->
        <div class="bg-orange-300 hover:shadow-2xl max-w-sm w-full h-full mt-4 mb-4 rounded-xl">
            <div class="m-4">
                <img src="./images/shoes-2.png" alt="Running shoes">
            </div>
            <h2 class="text-3xl text-amber-900  pl-2 "><i>Elite Street Runners</i></h2>
            <p class="text-gray-800  text-2xl pl-2">Men's running shoes</p>
            <h1 class="text-center text-4xl text-black pt-3"><sup>PKR</sup><b>39999/-</b> <del>49977/-</del></h1>
            <button
                class="flex items-center justify-center bg-green-900 hover:bg-green-700 pt-1 pb-1 text-white font-bold shadow-xl rounded-xl m-6 w-80 ml-[30px] h-[40px]">
                Add to Cart</button>

        </div>
        <!-- card-3 -->
        <div class="bg-orange-300 hover:shadow-2xl max-w-sm w-full h-full mt-4 mb-4 rounded-xl">
            <div class="m-4">
                <img src="./images/shoes-3.png" alt="Running shoes">
            </div>
            <h2 class="text-3xl text-amber-900  pl-2 "><i>Campus Level Shoes</i></h2>
            <p class="text-gray-800  text-2xl pl-2">Men's running shoes</p>
            <h1 class="text-center text-4xl text-black pt-3"><sup>PKR</sup><b>59999/-</b> <del>79879/-</del></h1>
            <button
                class="flex items-center justify-center bg-green-900 hover:bg-green-700 pt-1 pb-1 text-white font-bold shadow-xl rounded-xl m-6 w-80 ml-[30px] h-[40px]">
                Add to Cart</button>

        </div>
    </div>
    <div class="text-center text-gray-700 mt-4 mb-4">
        <p><b>Step into style.Walk with confidence😎</b></p>
    </div>
</body>

</html>
